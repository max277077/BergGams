<style>
:root{--bg:#f3f6f2;--card:#fff;--tx:#1b2a21;--mu:#66756b;--ac:#2f7d4f;--ln:#dde4de;--on:#fff;--wi:#d9822b}

*{box-sizing:border-box}html,body{margin:0}

.mu{color:var(--mu);font-size:14px}

.ov{position:fixed;inset:0;z-index:2000;background:var(--bg);overflow:auto;padding:14px 16px 40px}
.ov label{display:block;margin:10px 0 4px;font-size:14px;color:var(--mu)}
.row{display:flex;gap:10px}.row>div{flex:1}
.btn{padding:12px 16px;border:0;border-radius:10px;background:var(--ac);color:var(--on);font:inherit;font-weight:600}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--ln)}.btn.d{background:#c0392b;color:#fff}.btn.s{padding:8px 12px;font-size:14px}
.th{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.th img{width:84px;height:84px;object-fit:cover;border-radius:10px;cursor:zoom-in;display:block}
.pw{position:relative}.rm{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;border:0;background:#000b;color:#fff;font-size:14px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.kpi div{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px}.kpi b{display:block;font-size:24px;color:var(--ac)}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0}.bar span{width:90px;font-size:14px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar i{display:block;height:20px;background:var(--ac);border-radius:6px;min-width:4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0}.chips.w{flex-wrap:wrap}.chips button{flex:none;padding:6px 14px;border-radius:99px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font:inherit}.chips .on{background:var(--ac);color:var(--on)}
.mon{display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:8px}.mon div{flex:1;text-align:center;font-size:11px;color:var(--mu)}.mon i{display:block;background:var(--ac);border-radius:4px 4px 0 0;margin-bottom:2px}
.map{height:340px;border-radius:14px;border:1px solid var(--ln);position:relative;z-index:0}
.lb{position:fixed;inset:0;z-index:3000;background:#000e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px}.lb img{max-width:100%;max-height:78%;object-fit:contain}
.err{color:#c0392b}h3{margin:18px 0 6px}

/* ===== BergGams-Look ===== */
:root{--bg:#f6efd9;--card:#fffaf0;--tx:#22301f;--mu:#6b6a4f;--ac:#2f7d4f;--ln:#ddd3b0;--on:#fffaf0;--wi:#e0622b;--hi:#e0622b;--bd:#22301f;--sh:#22301f}
@media (prefers-color-scheme:dark){:root{--bg:#161b14;--card:#232c20;--tx:#f1ead6;--mu:#a9a98a;--ac:#7fcf8f;--ln:#2d3829;--on:#10160e;--wi:#f08a50;--hi:#f08a50;--bd:#7fcf8f;--sh:#000}}
body{font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;background-color:var(--bg);background-image:radial-gradient(var(--ln) 1.3px,transparent 1.5px);background-size:18px 18px}
header{gap:8px}.brand{display:flex;align-items:center;gap:10px}
.logo{width:56px;height:56px;transform:rotate(-7deg);filter:drop-shadow(3px 3px 0 var(--sh));flex:none}
.wm{font-family:"Bowlby One",Impact,"Arial Black",sans-serif;font-size:30px;line-height:1;letter-spacing:1px}
.wm i{font-style:normal;display:inline-block;color:var(--ac);text-shadow:2px 2px 0 var(--sh)}
.wm i:nth-child(odd){transform:rotate(-6deg) translateY(1px)}.wm i:nth-child(even){transform:rotate(5deg) translateY(-2px)}
.wm i:nth-child(n+5){color:var(--hi)}
.tag{padding:0 16px 2px;color:var(--hi);font-weight:600;transform:rotate(-1.5deg);transform-origin:left}
.card{border:2px solid var(--bd);box-shadow:4px 4px 0 var(--sh);border-radius:16px 22px 14px 20px}
.card:nth-child(odd){transform:rotate(-.3deg)}.card:nth-child(even){transform:rotate(.4deg)}
.btn,nav button,.chips button{border:2px solid var(--bd);box-shadow:3px 3px 0 var(--sh);border-radius:14px 18px 12px 16px}
.btn:active,nav button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--sh)}
nav button{font-weight:600}nav button.on,.btn{color:var(--on)}.btn.g{color:var(--tx)}
.fab{border:2px solid var(--bd);box-shadow:4px 4px 0 var(--sh);transform:rotate(-8deg);background:var(--hi)}
.badge{background:var(--hi);border:1.5px solid var(--bd);transform:rotate(-3deg);padding:1px 10px}
.kpi div{border:2px solid var(--bd);box-shadow:3px 3px 0 var(--sh);border-radius:16px 12px 18px 12px}.kpi b{color:var(--hi);font-family:"Bowlby One",sans-serif;font-weight:400}
input,select,textarea,.map{border:2px solid var(--bd)}
h2,h3{font-family:"Bowlby One",sans-serif;font-weight:400}h3{text-decoration:underline wavy var(--hi);text-underline-offset:6px}
.bar i{border:2px solid var(--bd);background:var(--hi)}.mon i{border:2px solid var(--bd);background:var(--hi)}
.ov{background-color:var(--bg);background-image:radial-gradient(var(--ln) 1.3px,transparent 1.5px);background-size:18px 18px}
.logo{transform:none;filter:none}
.wm{font-family:"Helvetica Neue",Arial,sans-serif;font-weight:800;font-size:28px;letter-spacing:1px}.wm i{transform:none!important;text-shadow:none}
.tag{transform:none;font-weight:400}
nav button{font-size:13px;padding:9px 1px}
</style></head><body>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

const cfg={apiKey:"AIzaSyANxu80q66B95RIS3EZLcXhzr0zVoXWMvk",authDomain:"berggams.firebaseapp.com",projectId:"berggams",appId:"1:938302229700:web:9b99976a651ad11245cd91"};
const app=initializeApp(cfg),auth=getAuth(app),db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
const T2=p=>Promise.race([p,new Promise(ok=>setTimeout(ok,2000))]);
const setDoc=(r,d)=>T2(_setDoc(r,JSON.parse(JSON.stringify(d)))),deleteDoc=r=>T2(_deleteDoc(r));
const ART={"Wandern":{i:"🥾",u:["Wanderung","Bergwanderung","Gipfeltour","Hüttenwanderung","Weitwanderung","Schneeschuhwandern"]},"Klettern":{i:"🧗",u:["Klettersteig","Alpinklettern","Mehrseillängen","Sportklettern","Eisklettern"]},"Hochtour":{i:"🏔️",u:["Gletschertour","Hochtour","Skitour","Skihochtour","Firn & Mixed"]},"Berglauf":{i:"🏃",u:["Trailrun","Berglauf","Vertical Kilometer","Ultratrail","Skyrace"]}};
const GR=(a,u)=>a=="Wandern"?["T1 – Wandern","T2 – Bergwandern","T3 – anspruchsvoll","T4 – Alpinwandern","T5 – anspruchsvoll alpin","T6 – schwer alpin"]:a=="Klettern"?(u=="Klettersteig"?["A","B","C","D","E","F"]:u=="Eisklettern"?["WI 1","WI 2","WI 3","WI 4","WI 5","WI 6"]:["UIAA 2","UIAA 3","UIAA 4","UIAA 5","UIAA 6","UIAA 7","UIAA 8+"]):a=="Hochtour"?["F","WS","ZS","S","SS","AS"]:["leicht","mittel","schwer","extrem"];

let tf="",qs="",gv="hoehe";const artChips=()=>`<div class="chips"><button data-a="" class="${tf?"":"on"}">Alle Arten</button>${Object.keys(ART).map(a=>`<button data-a="${a}" class="${tf==a?"on":""}">${ART[a].i} ${a}</button>`).join("")}</div>`;
const MON=["J","F","M","A","M","J","J","A","S","O","N","D"],OSM="https://tile.openstreetmap.org/{z}/{x}/{y}.png";

onAuthStateChanged(auth,u=>{
 me=u;if(unsub)unsub();if(unsub2)unsub2();unsub=unsub2=null;

 ensureUser(u);
 const ua=onSnapshot(collection(db,"users"),s=>{uDocs={};s.docs.forEach(d=>uDocs[d.id]=d.data());mix()}),pa=onSnapshot(collection(db,"profile"),s=>{pDocs={};s.docs.forEach(d=>pDocs[d.id]=d.data());mix()});unsub2=()=>{ua();pa()};
 unsub=onSnapshot(collection(db,"tours"),s=>{items=s.docs.map(d=>fix({id:d.id,...d.data()})).sort((a,b)=>(b.datum||"").localeCompare(a.datum||""));if(!$(".ov"))render()},e=>$("#main").innerHTML=`<p class="err">Kein Zugriff: ${esc(e.message)}<br>Ist deine E-Mail in den Regeln eingetragen?</p>`);
});

function filt(){const ids=[...new Set(Object.keys(users).concat(items.map(t=>t.uid)))];return ids.length>1?`<div class="chips"><button data-w="" class="${who?"":"on"}">Alle</button>${ids.map(u=>`<button data-w="${u}" class="${who==u?"on":""}">${esc(uname(u))}</button>`).join("")}</div>`:""}

 if(gm){gm.remove();gm=null}
 document.querySelectorAll("#nav button").forEach(b=>b.className=b.dataset.t==tab?"on":"");
 if(!me)return;
 const ur=users[me.uid];$("#me").textContent=(me.displayName||me.email)+(ur?" · "+(ur.role=="kind"?"Kind (Höhenmeter ×4)":"Erwachsene/r"):"")+(navigator.onLine?"":" · 📴 offline");

  const fl=()=>{const f=done().filter(t=>(!tf||t.art==tf)&&((t.name||"")+" "+(t.gipfel||"")+" "+(t.ort||"")+" "+(t.bl||"")).toLowerCase().includes(qs.toLowerCase()));$("#lst").innerHTML=f.length?f.map(t=>card(t)).join(""):`<p class="mu">Keine Touren gefunden. Tippe auf +.</p>`;bindC()};

  gm=L.map("gm").setView([47.5,13.5],7);L.tileLayer(OSM,{attribution:"© OpenStreetMap",maxZoom:17}).addTo(gm);

function stats(){

 <h3>Touren pro Jahr</h3>${ys.map(y=>`<div class="bar" data-y="${y}" style="cursor:pointer"><span>${y}</span><i style="width:${by[y]/all*60}%"></i><b>${by[y]}</b></div>`).join("")||'<p class="mu">Noch keine Daten.</p>'}
 ${yr?`<h3>Jahr ${yr}</h3><div class="chips">${ys.map(y=>`<button data-y="${y}" class="${y==yr?"on":""}">${y}</button>`).join("")}</div>

  fm=L.map(o.querySelector("#fm")).setView(t.lat!=null&&t.lat!==""?[+t.lat,+t.lon]:[47.5,13.5],t.lat!=null&&t.lat!==""?12:7);L.tileLayer(OSM,{attribution:"© OpenStreetMap",maxZoom:17}).addTo(fm);
  const put=p=>{mk?mk.setLatLng(p):mk=L.marker(p).addTo(fm)};if(t.lat!=null&&t.lat!=="")put([+t.lat,+t.lon]);
  if(t.track&&t.track.length>3){const a=[];for(let i=0;i<t.track.length;i+=2)a.push([t.track[i],t.track[i+1]]);const pl=L.polyline(a,{color:"#e0622b",weight:4}).addTo(fm);fm.fitBounds(pl.getBounds(),{padding:[20,20]})}
  o.querySelectorAll("[data-s]").forEach(im=>im.onclick=()=>show(all().map(p=>p.data),+im.dataset.s));
  o.querySelector("#x").onclick=close;
  if(!own)return;
  fm.on("click",e=>{t.lat=+e.latlng.lat.toFixed(5);t.lon=+e.latlng.lng.toFixed(5);put(e.latlng);look()});
  o.querySelector("#gps").onclick=()=>navigator.geolocation.getCurrentPosition(p=>{t.lat=+p.coords.latitude.toFixed(5);t.lon=+p.coords.longitude.toFixed(5);put([t.lat,t.lon]);fm.setView([t.lat,t.lon],13);look()},()=>o.querySelector("#gt").textContent="Nicht verfügbar");
  const rd=()=>{const v=(k,f)=>{const e=o.querySelector("#"+k);return e?e.value:t[f]};Object.assign(t,{name:v("a","name"),ort:v("b","ort"),datum:v("c","datum"),hoehe:v("d","hoehe"),hm:v("e","hm"),km:v("f","km"),dauer:v("g","dauer"),art:v("ta","art"),unter:v("tu","unter"),schw:v("h","schw"),notiz:v("i","notiz")})};
  const look=async()=>{const bx=o.querySelector("#pk");if(!bx)return;bx.innerHTML='<span class="mu">Suche Gipfel…</span>';
   try{const [ps,g]=await Promise.all([peaks(t.lat,t.lon),geo(t.lat,t.lon).catch(()=>({}))]);Object.assign(t,g);
    bx.innerHTML=(t.bl||t.land?`<p class="mu">📍 ${esc([t.bl,t.land].filter(Boolean).join(", "))}</p>`:"")+(ps.length?`<div class="chips w">${ps.map((p,i)=>`<button type="button" data-k="${i}">${esc(p.name)}${p.ele?" · "+p.ele+" m":""}</button>`).join("")}</div>`:'<p class="mu">Kein benannter Gipfel in 1,5 km.</p>');
    bx.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const p=ps[+b.dataset.k];rd();t.gipfel=p.name;if(p.ele)t.hoehe=p.ele;if(!(t.name||"").trim())t.name=p.name;draw()})}catch(e){bx.innerHTML='<span class="mu">Gipfelsuche nicht möglich (offline?).</span>'}};
  o.querySelector("#gx").onchange=async e=>{rd();try{const r=await gpx(e.target.files[0]);if(!w&&(!t.datum||n))t.datum=r.datum||t.datum;Object.assign(t,{km:r.km,hm:r.hm,dauer:r.dauer,lat:r.lat,lon:r.lon,track:r.track});if(r.hoehe)t.hoehe=r.hoehe;draw();look()}catch(x){o.querySelector("#er").textContent="GPX: "+x.message}};
  o.querySelectorAll("#mt [data-u]").forEach(b=>b.onclick=()=>{const u=b.dataset.u;mit.has(u)?mit.delete(u):mit.add(u);b.className=mit.has(u)?"on":""});
  const fam=o.querySelector("#fam");if(fam)fam.onclick=()=>{others.forEach(u=>mit.add(u));o.querySelectorAll("#mt [data-u]").forEach(b=>b.className="on")};
  o.querySelector("#ta").onchange=()=>{rd();t.unter=ART[t.art].u[0];t.schw=GR(t.art,t.unter)[1]||GR(t.art,t.unter)[0];draw()};
  o.querySelector("#tu").onchange=()=>{rd();const g=GR(t.art,t.unter);if(g.indexOf(t.schw)<0)t.schw=g[0];draw()};
  o.querySelector("#p").onchange=async e=>{rd();for(const f of e.target.files){const s=await shrink(f);if(s)add.push(s)}draw()};
  o.querySelectorAll(".rm").forEach(b=>b.onclick=()=>{rd();b.dataset.k=="p"?rem.push(b.dataset.v):add.splice(+b.dataset.v,1);draw()});
  o.querySelector("#s").onclick=async()=>{rd();if(!t.name.trim()||(!w&&!t.datum)){o.querySelector("#er").textContent="Bitte Name"+(w?"":" und Datum")+" angeben.";return}
   try{await setDoc(doc(db,"tours",id),{...strip(t),uid:t.uid||me.uid,user:t.user||me.displayName||me.email,wish:w,mit:w?[]:[...mit]});
    for(const p of rem)await deleteDoc(doc(db,"photos",p));
    for(const p of add)await setDoc(doc(db,"photos",id+"_"+Math.random().toString(36).slice(2,8)),{tour:id,uid:me.uid,data:p});close()}catch(e){o.querySelector("#er").textContent=e.message}};
  const dl=o.querySelector("#dl");if(dl)dl.onclick=async()=>{if(!dl.dataset.s){dl.dataset.s=1;dl.textContent="Wirklich löschen? Nochmal tippen";return}for(const p of ph)await deleteDoc(doc(db,"photos",p.id));await deleteDoc(doc(db,"tours",id));close()};
 };
 draw();
}
</script></body></html>
