 const PL=Object.values(G),band=g=>g.h>=4000?"4000er":g.h>=3000?"3000er":g.h>=2000?"2000er":g.h>=1000?"1000er":g.h>0?"unter 1000 m":"ohne Höhe";

 let body="";
 if(gv=="ort"){const bl={};PL.forEach(g=>{const c=g.land||"Land unbekannt",r=g.bl||"Region unbekannt";bl[c]=bl[c]||{};(bl[c][r]=bl[c][r]||[]).push(g)});
  const cc=o=>Object.values(o).reduce((s,a)=>s+a.length,0);
  body=Object.keys(bl).sort((a,b)=>cc(bl[b])-cc(bl[a])||a.localeCompare(b)).map(c=>det("L:"+c,"🌍 "+c,cc(bl[c]),Object.keys(bl[c]).sort((a,b)=>bl[c][b].length-bl[c][a].length||a.localeCompare(b)).map(r=>det("R:"+c+"/"+r,r,bl[c][r].length,bl[c][r].sort(so).map(row).join(""),false)).join(""),true)).join("")}
 else{const k=g=>gv=="hoehe"?band(g):(g.name[0]||"#").toUpperCase(),grp={};PL.forEach(g=>(grp[k(g)]=grp[k(g)]||[]).push(g));
  const ord=gv=="hoehe"?["4000er","3000er","2000er","1000er","unter 1000 m","ohne Höhe"].filter(x=>grp[x]):Object.keys(grp).sort((a,b)=>a.localeCompare(b));
  body=ord.map(x=>det("G:"+gv+x,x,grp[x].length,grp[x].sort(so).map(row).join(""),true)).join("")}

function shrink(f){return new Promise(ok=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.65))};im.onerror=()=>ok(null);im.src=r.result};r.readAsDataURL(f)})}
function show(list,start){
 let i=start,tm=null;const l=document.createElement("div");l.className="lb";
 l.innerHTML=`<img id="bi"><div id="bc" style="color:#fff"></div><div class="row"><button class="btn g s" id="pv">‹</button><button class="btn g s" id="pl"></button><button class="btn g s" id="nx">›</button><button class="btn g s" id="cl">✕</button></div>`;
 document.body.append(l);
 const draw=()=>{l.querySelector("#bi").src=list[i];l.querySelector("#bc").textContent=(i+1)+" / "+list.length};
 const go=d=>{i=(i+d+list.length)%list.length;draw()};
 const play=on=>{clearInterval(tm);tm=on&&list.length>1?setInterval(()=>go(1),3000):null;l.querySelector("#pl").textContent=tm?"⏸":"▶"};
 l.querySelector("#pv").onclick=()=>{go(-1);play(false)};l.querySelector("#nx").onclick=()=>{go(1);play(false)};
 l.querySelector("#pl").onclick=()=>play(!tm);l.querySelector("#cl").onclick=()=>{clearInterval(tm);l.remove()};
 let x0=0;l.ontouchstart=e=>x0=e.touches[0].clientX;l.ontouchend=e=>{const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>40){go(d<0?1:-1);play(false)}};
 draw();play(true);
}

  const rd=()=>{const v=(k,f)=>{const e=o.querySelector("#"+k);return e?e.value:t[f]};Object.assign(t,{name:v("a","name"),ort:v("b","ort"),datum:v("c","datum"),hoehe:v("d","hoehe"),hm:v("e","hm"),km:v("f","km"),dauer:v("g","dauer"),art:v("ta","art"),unter:v("tu","unter"),schw:v("h","schw"),notiz:v("i","notiz")})};
